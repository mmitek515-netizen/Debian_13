# Run with:
# docker compose -f compose.yaml -f compose.ollama.yaml up -d --build
# The model is downloaded automatically on first startup by ollama-model-init.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    # No host port published; the model server is reachable only by Compose services.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 20g
  ollama-model-init:
    image: ollama/ollama:latest
    restart: on-failure
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 3; done
      OLLAMA_HOST=http://ollama:11434 ollama pull "${OLLAMA_MODEL:-llama3.2-vision:11b}"
      if [ "${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}" != "${OLLAMA_MODEL:-llama3.2-vision:11b}" ]; then
        OLLAMA_HOST=http://ollama:11434 ollama pull "${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}"
      fi
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2-vision:11b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  debian13-system:
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      MODEL_CHAT_URL: http://ollama:11434/v1/chat/completions
      MODEL_API_KEY: ollama-local-no-remote-secret
      MODEL_NAME: ${OLLAMA_MODEL:-llama3.2-vision:11b}
      VISION_MODEL_NAME: ${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}
      DEBIAN13_ALLOW_INTERNAL_OLLAMA: "1"
      OLLAMA_VISION_URL: http://ollama:11434/v1/chat/completions
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}
  debian13-ai-worker:
    build:
      context: .
    image: debian13-system:local
    entrypoint: ["python3", "/opt/debian13/system/ai_center_worker.py"]
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    user: "10001:10001"
    environment:
      WORKSPACE_DIR: /workspace
      OLLAMA_CHAT_URL: http://ollama:11434/v1/chat/completions
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2-vision:11b}
    volumes:
      - debian13-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
volumes:
  ollama-models:
